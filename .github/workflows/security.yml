name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1" # weekly, Monday 06:00 WAT

permissions:
  contents: read

jobs:
  # Secret scanning over the whole git history with the gitleaks CLI (MIT).
  # Not gitleaks-action: on a first push it scans "<root>^..HEAD", which doesn't exist,
  # and fails with "ambiguous argument" without scanning anything.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1 (checksum verified)
        run: |
          v=8.30.1
          base=https://github.com/gitleaks/gitleaks/releases/download/v$v
          curl -sSfL -o /tmp/gitleaks.tgz "$base/gitleaks_${v}_linux_x64.tar.gz"
          curl -sSfL -o /tmp/sums.txt "$base/gitleaks_${v}_checksums.txt"
          echo "$(grep "gitleaks_${v}_linux_x64.tar.gz" /tmp/sums.txt | cut -d' ' -f1)  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
      - name: Scan all commits
        run: /tmp/gitleaks git --redact --no-banner --exit-code 1 --report-format sarif --report-path gitleaks.sarif .
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: npm audit (backend)
        run: npm audit --omit=dev --audit-level=high
        working-directory: backend
      - name: npm audit (web)
        run: npm audit --omit=dev --audit-level=high
        working-directory: web

  # Static analysis with Semgrep CE (engine LGPL-2.1; registry rules licensed for internal
  # use, which covers scanning our own private code). Fails on ERROR-severity findings.
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install semgrep==1.185.0
      - name: Semgrep
        run: |
          semgrep scan --metrics=off --error --severity ERROR \
            --config p/typescript --config p/nodejs --config p/react --config p/github-actions --config p/dockerfile \
            --sarif --output semgrep.sarif
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: semgrep-report
          path: semgrep.sarif
          if-no-files-found: ignore

  # CodeQL's licence only allows free use on open-source code. This repository is private,
  # so the job is off until you either make the repo public or buy GitHub Advanced Security
  # (then: Settings → Code security → enable code scanning, and set the repository
  # variable CODEQL_ENABLED=true).
  codeql:
    if: ${{ vars.CODEQL_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
