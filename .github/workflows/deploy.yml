name: deploy

# Manual, approved deploys with Helm. Configure in GitHub:
#   - Environments "staging" and "production" with required reviewers.
#   - Environment secret KUBECONFIG_B64 (base64 kubeconfig for a deploy-only service account).
#   - Environment variable VALUES_FILE (e.g. infra/helm/values-production.yaml, kept out of git if it
#     holds anything sensitive; secrets themselves come from your secret manager via External Secrets).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        required: true
      version:
        description: Image tag to deploy (e.g. 0.4.0) — every image must already be released
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.2
      # Inputs and secrets reach the shell only through env vars, never ${{ }} inside
      # the script (prevents shell injection from a crafted version string).
      - name: Check inputs
        env:
          VERSION: ${{ inputs.version }}
          VALUES_FILE: ${{ vars.VALUES_FILE }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "version must look like 1.2.3"; exit 1; }
          [[ "$VALUES_FILE" =~ ^[A-Za-z0-9_./-]+\.ya?ml$ && -f "$VALUES_FILE" ]] || { echo "VALUES_FILE must be an existing .yaml file in the repo"; exit 1; }
      - name: Kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          mkdir -p ~/.kube
          printf '%s' "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: Diff-free dry run first
        env:
          VERSION: ${{ inputs.version }}
          VALUES_FILE: ${{ vars.VALUES_FILE }}
          OWNER: ${{ github.repository_owner }}
        run: |
          helm upgrade --install willspot infra/helm/willspot --namespace willspot \
            -f "$VALUES_FILE" --set image.tag="$VERSION" \
            --set image.registry="ghcr.io/$OWNER" --dry-run=server > /dev/null
      - name: Deploy (migrations run first; rolls back automatically if anything fails)
        env:
          VERSION: ${{ inputs.version }}
          VALUES_FILE: ${{ vars.VALUES_FILE }}
          OWNER: ${{ github.repository_owner }}
        run: |
          helm upgrade --install willspot infra/helm/willspot --namespace willspot \
            -f "$VALUES_FILE" --set image.tag="$VERSION" \
            --set image.registry="ghcr.io/$OWNER" \
            --rollback-on-failure --wait --timeout 15m
      - name: Smoke check through the public gateway
        run: |
          host=$(helm get values willspot -n willspot -a -o json | python3 -c "import json,sys;print(json.load(sys.stdin)['ingress']['api']['host'])")
          for i in $(seq 1 20); do curl -sf "https://$host/readyz" && exit 0; sleep 6; done
          echo "gateway not ready after deploy"; exit 1
