name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "brand/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "brand/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["55433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_DATABASE_ADMIN_URL: postgres://postgres@127.0.0.1:55433/postgres
      - name: End-to-end smoke test through the gateway
        env:
          PGHOST: 127.0.0.1
        run: |
          npm run env:init -- --db postgres://postgres@127.0.0.1:55433
          npm run dev > dev.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8080/readyz && break; sleep 2; done
          set -a; . ./.env; set +a
          npx tsx scripts/smoke.ts || (cat dev.log; exit 1)

  images:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, identity, wallet, trade, config, giftcards, bills]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          tags: willspot-${{ matrix.service }}:ci
          load: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Scan image for known vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: willspot-${{ matrix.service }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
