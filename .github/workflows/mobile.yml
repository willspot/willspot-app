name: mobile

on:
  push:
    branches: [main]
    paths: ["mobile/**", "brand/**", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["mobile/**", "brand/**", ".github/workflows/mobile.yml"]

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - name: Bundled brand and FAQ match brand/ (run web/scripts/sync-brand.mjs after editing)
        run: |
          diff ../brand/brand.json assets/brand.json
          diff ../brand/faq.json assets/faq.json
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test || echo "::warning::run dart format"
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Build release APK (obfuscated)
        env:
          API_URL: ${{ vars.API_URL || 'https://api.example.com' }}
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols "--dart-define=API_URL=$API_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

  ios:
    needs: test
    runs-on: macos-latest
    # Hosted macOS runners are sometimes unavailable (GitHub capacity); don't hang for hours.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Build iOS (unsigned; signing needs your Apple certificates in secrets)
        env:
          API_URL: ${{ vars.API_URL || 'https://api.example.com' }}
        run: flutter build ios --release --no-codesign --obfuscate --split-debug-info=build/symbols "--dart-define=API_URL=$API_URL"
