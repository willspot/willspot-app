name: release

# Tag a component to ship it on its own, e.g.  git tag wallet-v0.2.0 && git push --tags
on:
  push:
    tags: ["gateway-v*", "identity-v*", "wallet-v*", "trade-v*", "config-v*", "giftcards-v*", "bills-v*", "risk-v*", "notifications-v*", "admin-v*", "backup-v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    environment: production # add required reviewers on this environment in GitHub settings
    steps:
      - uses: actions/checkout@v4
      - name: Work out service and version from the tag
        id: meta
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "service=${tag%%-v*}" >> "$GITHUB_OUTPUT"
          echo "version=${tag##*-v}" >> "$GITHUB_OUTPUT"
          case "${tag%%-v*}" in
            admin)  echo "file=web/admin/Dockerfile" >> "$GITHUB_OUTPUT"; echo "context=." >> "$GITHUB_OUTPUT" ;;
            backup) echo "file=infra/backup/Dockerfile" >> "$GITHUB_OUTPUT"; echo "context=infra/backup" >> "$GITHUB_OUTPUT" ;;
            *)      echo "file=backend/Dockerfile" >> "$GITHUB_OUTPUT"; echo "context=." >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ steps.meta.outputs.context }}
          file: ${{ steps.meta.outputs.file }}
          build-args: SERVICE=${{ steps.meta.outputs.service }}
          push: true
          provenance: true
          sbom: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/willspot-${{ steps.meta.outputs.service }}:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/willspot-${{ steps.meta.outputs.service }}:latest
      # Deploying is a separate, approved step: run the "deploy" workflow with this version.
