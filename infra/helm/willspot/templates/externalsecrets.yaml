{{- if .Values.externalSecrets.enabled }}
{{- range $name, $svc := .Values.services }}
---
# Pulls one JSON secret per service from your secret manager into "<release>-<service>".
# Migration Jobs retry (backoffLimit) while External Secrets Operator syncs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "willspot.fullname" $ }}-{{ $name }}
  labels: {{- include "willspot.labels" $ | nindent 4 }}
  annotations:
    # Created before the migration Jobs (weight 0) so their credentials exist on first install.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval }}
  secretStoreRef: {{- toYaml $.Values.externalSecrets.secretStoreRef | nindent 4 }}
  target:
    name: {{ include "willspot.fullname" $ }}-{{ $name }}
    # Orphan: the Secret survives when Helm re-creates this hook on upgrade.
    creationPolicy: Orphan
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: {{ $.Values.externalSecrets.remotePrefix }}/{{ $name }}
{{- end }}
{{- if .Values.backup.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "willspot.fullname" . }}-backup
  labels: {{- include "willspot.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef: {{- toYaml .Values.externalSecrets.secretStoreRef | nindent 4 }}
  target:
    name: {{ include "willspot.fullname" . }}-backup
    # Orphan: the Secret survives when Helm re-creates this hook on upgrade.
    creationPolicy: Orphan
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.remotePrefix }}/backup
{{- end }}
{{- end }}
