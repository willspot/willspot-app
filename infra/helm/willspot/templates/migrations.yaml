{{- if .Values.migrations.enabled }}
{{- range $name, $svc := .Values.services }}
{{- if $svc.database }}
---
# Schema migrations with the schema-owner credentials (MIGRATOR_DATABASE_URL), which the
# running pods never receive as their database URL. Runs before the first install and before
# every upgrade, before any pod of the new version starts; migrate() takes an advisory lock,
# so a re-run is harmless. Migrations must stay backward compatible with the running version
# (expand first, contract in a later release) because old pods serve traffic meanwhile.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "willspot.fullname" $ }}-migrate-{{ $name }}
  labels: {{- include "willspot.labels" $ | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ $.Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ $.Values.migrations.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "willspot.labels" $ | nindent 8 }}
        app.kubernetes.io/name: migrate-{{ $name }}
    spec:
      restartPolicy: Never
      # Hooks run before the release's ServiceAccounts and ConfigMap exist, so this Job uses the
      # namespace default account (no token) and gets its settings inline.
      automountServiceAccountToken: false
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- include "willspot.podSecurityContext" $ | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "willspot.image" (dict "root" $ "name" $name "image" $svc.image) }}
          envFrom:
            - secretRef: { name: {{ include "willspot.fullname" $ }}-{{ $name }} }
          env:
            {{- range $k, $v := $.Values.config }}
            {{- if not (has $k (list "METRICS_PORT" "MIGRATE_ONLY" "MIGRATE_ON_START")) }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
            {{- end }}
            - { name: MIGRATE_ONLY, value: "1" }
            - { name: METRICS_PORT, value: "0" }
            - name: {{ upper $name }}_DATABASE_URL
              valueFrom:
                secretKeyRef: { name: {{ include "willspot.fullname" $ }}-{{ $name }}, key: MIGRATOR_DATABASE_URL }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext: {{- include "willspot.containerSecurityContext" $ | nindent 12 }}
{{- end }}
{{- end }}
{{- end }}
