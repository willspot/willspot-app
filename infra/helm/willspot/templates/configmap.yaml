apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "willspot.fullname" . }}-config
  labels: {{- include "willspot.labels" . | nindent 4 }}
data:
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- range $name, $svc := .Values.services }}
  {{ upper $name }}_INTERNAL_URL: {{ printf "http://%s-%s:%v" (include "willspot.fullname" $) $name $svc.port | quote }}
  {{- end }}
