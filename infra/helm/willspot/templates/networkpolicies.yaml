{{- if .Values.networkPolicy.enabled }}
# Default deny for every WillSpot pod, then allow exactly the calls the code makes.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "willspot.fullname" . }}-default-deny
  labels: {{- include "willspot.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
{{- range $name, $svc := .Values.services }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "willspot.fullname" $ }}-{{ $name }}
  labels: {{- include "willspot.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "willspot.selector" (dict "root" $ "name" $name) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    {{- if $svc.public }}
    - from:
        - namespaceSelector:
            matchLabels: {{- toYaml $.Values.networkPolicy.ingressNamespaceLabels | nindent 14 }}
        {{- if $.Values.admin.enabled }}
        - podSelector:
            matchLabels: {{- include "willspot.selector" (dict "root" $ "name" "admin") | nindent 14 }}
        {{- end }}
      ports: [{ port: http }]
    {{- end }}
    {{- if $svc.allowFrom }}
    - from:
        {{- range $caller := $svc.allowFrom }}
        - podSelector:
            matchLabels: {{- include "willspot.selector" (dict "root" $ "name" $caller) | nindent 14 }}
        {{- end }}
      ports: [{ port: http }]
    {{- end }}
    - from:
        - namespaceSelector:
            matchLabels: {{- toYaml $.Values.networkPolicy.monitoringNamespaceLabels | nindent 14 }}
      ports: [{ port: metrics }]
{{- end }}
{{- if .Values.admin.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "willspot.fullname" . }}-admin
  labels: {{- include "willspot.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "willspot.selector" (dict "root" . "name" "admin") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {{- toYaml .Values.networkPolicy.ingressNamespaceLabels | nindent 14 }}
      ports: [{ port: http }]
{{- end }}
{{- end }}
