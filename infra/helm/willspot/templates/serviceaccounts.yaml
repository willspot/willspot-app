{{- range $name, $svc := .Values.services }}
---
# One identity per service; no Kubernetes API access needed, so no token is mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "willspot.fullname" $ }}-{{ $name }}
  labels: {{- include "willspot.labels" $ | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
