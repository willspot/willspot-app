{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "willspot.fullname" . }}-api
  labels: {{- include "willspot.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.ingress.api.host | quote }}]
      secretName: {{ .Values.ingress.api.tlsSecret }}
  rules:
    - host: {{ .Values.ingress.api.host | quote }}
      http:
        paths:
          # Only the gateway is public. It routes /v1/* and never /internal/* (gateway/src/app.ts).
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "willspot.fullname" . }}-gateway
                port: { name: http }
{{- if .Values.admin.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "willspot.fullname" . }}-admin
  labels: {{- include "willspot.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.ingress.admin.allowCidrs }}
    nginx.ingress.kubernetes.io/whitelist-source-range: {{ .Values.ingress.admin.allowCidrs | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.ingress.admin.host | quote }}]
      secretName: {{ .Values.ingress.admin.tlsSecret }}
  rules:
    - host: {{ .Values.ingress.admin.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "willspot.fullname" . }}-admin
                port: { name: http }
{{- end }}
{{- end }}
