# Full WillSpot backend locally:
#   cd backend && npm run env:init   (once; DB URLs are overridden below for containers)
#   docker compose -f infra/docker-compose.yml up --build
# Only the gateway is published to the host. Images copy files in (no bind mounts),
# so this also works from /Applications/XAMPP where Docker cannot bind-mount.

name: willspot

x-service: &service
  build:
    context: ..
    dockerfile: backend/Dockerfile
  restart: unless-stopped
  env_file: ../backend/.env
  environment: &common-env
    NODE_ENV: development
    IDENTITY_INTERNAL_URL: http://identity:4001
    WALLET_INTERNAL_URL: http://wallet:4002
    TRADE_INTERNAL_URL: http://trade:4003
    CONFIG_INTERNAL_URL: http://config:4004
    GIFTCARDS_INTERNAL_URL: http://giftcards:4005
    BILLS_INTERNAL_URL: http://bills:4006
    REDIS_URL: redis://redis:6379
    IDENTITY_DATABASE_URL: postgres://willspot:willspot@postgres:5432/willspot_identity
    WALLET_DATABASE_URL: postgres://willspot:willspot@postgres:5432/willspot_wallet
    TRADE_DATABASE_URL: postgres://willspot:willspot@postgres:5432/willspot_trade
    CONFIG_DATABASE_URL: postgres://willspot:willspot@postgres:5432/willspot_config
    GIFTCARDS_DATABASE_URL: postgres://willspot:willspot@postgres:5432/willspot_giftcards
    BILLS_DATABASE_URL: postgres://willspot:willspot@postgres:5432/willspot_bills
  depends_on:
    postgres:
      condition: service_healthy
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  networks: [internal]

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: willspot
      POSTGRES_PASSWORD: willspot
    volumes:
      - pgdata:/var/lib/postgresql/data
    configs:
      - source: pg_init
        target: /docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U willspot"]
      interval: 5s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [internal]

  giftcards:
    <<: *service
    build: { context: .., dockerfile: backend/Dockerfile, args: { SERVICE: giftcards } }
    environment: { <<: *common-env, PORT: "4005" }

  bills:
    <<: *service
    build: { context: .., dockerfile: backend/Dockerfile, args: { SERVICE: bills } }
    environment: { <<: *common-env, PORT: "4006" }

  config:
    <<: *service
    build: { context: .., dockerfile: backend/Dockerfile, args: { SERVICE: config } }
    environment: { <<: *common-env, PORT: "4004" }

  identity:
    <<: *service
    build: { context: .., dockerfile: backend/Dockerfile, args: { SERVICE: identity } }
    environment: { <<: *common-env, PORT: "4001" }

  wallet:
    <<: *service
    build: { context: .., dockerfile: backend/Dockerfile, args: { SERVICE: wallet } }
    environment: { <<: *common-env, PORT: "4002" }

  trade:
    <<: *service
    build: { context: .., dockerfile: backend/Dockerfile, args: { SERVICE: trade } }
    environment: { <<: *common-env, PORT: "4003" }

  gateway:
    <<: *service
    build: { context: .., dockerfile: backend/Dockerfile, args: { SERVICE: gateway } }
    environment: { <<: *common-env, PORT: "8080" }
    depends_on: [identity, wallet, trade, config, giftcards, bills, redis]
    ports: ["8080:8080"]
    networks: [internal, edge]

configs:
  pg_init:
    file: ./postgres-init.sql

volumes:
  pgdata:

networks:
  internal:
    internal: true
  edge: {}
