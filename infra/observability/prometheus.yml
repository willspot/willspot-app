# Local Prometheus for docker compose. In Kubernetes the Helm chart's ServiceMonitors do this.
global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/rules/*.yml
scrape_configs:
  - job_name: willspot
    static_configs:
      - targets:
          - gateway:9464
          - identity:9464
          - wallet:9464
          - trade:9464
          - config:9464
          - giftcards:9464
          - bills:9464
          - risk:9464
          - notifications:9464
    relabel_configs:
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: pod_service
